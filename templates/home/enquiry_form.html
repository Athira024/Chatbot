{% extends 'home/home_layout.html' %}
{% block content %}
{% load static %}

      <div class="brand_color">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="titlepage">
                        <h2>Enquiry Form</h2>
                    </div>
                </div>
            </div>
        </div>

    </div>
                        <section>
                           <div class="container mt-5">
                           <form action="{% url 'save_enquiry' %}" method="post">
                            {% csrf_token %}
                           <div class="mb-3">
                              <label for="name" class="form-label">Full Name</label>
                              <input type="text" class="form-control" id="name" name="full_name" required>
                           </div>
                           <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <input type="text" class="form-control" id="address" name="address" required>
                           </div>
                           <div class="mb-3">
                                  <label for="phone" class="form-label">Phone No.</label>
                                  <input type="text" class="form-control" id="phone" name="phone_no" required>
                           </div>  
                           <div class="mb-3">
                              <label for="email" class="form-label">Email</label>
                              <input type="email" class="form-control" id="email" name="email" required>
                           </div>
                           <div class="mb-3">
                              <label for="message" class="form-label">Message</label>
                              <textarea class="form-control" id="message" rows="3" name="message" required></textarea>
                           </div>
                           <button class="send">Send</button>
                           </form>
                           </div>
                        </section>

    <!-- end contact -->
     {% endblock %}
